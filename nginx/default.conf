upstream user_upstream { server user-service:3000; }
upstream bus_upstream { server bus-service:3000; }
upstream booking_upstream { server booking-service:3000; }

server {
    listen 80;
    server_name _;

    location = / {
        default_type application/json;
        return 200 '{"application":"BusBooking","status":"running","routes":["/api/users/","/api/buses/","/api/bookings/"]}';
    }

    location /api/users/ {
        proxy_pass http://user_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/buses/ {
        proxy_pass http://bus_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/bookings/ {
        proxy_pass http://booking_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
